<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapel Sacred Calendar</title>

<!-- PWA / home-screen installation -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#636f48">

<!-- iOS compatibility (harmless on other platforms) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sacred Calendar">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="stylesheet" href="app/app.css">
</head>
<body>

<!-- Application shell -->
<div class="cal-card" id="cal-card">
  <p class="cal-month"  id="cal-month"></p>
  <p class="cal-day"    id="cal-day"></p>
  <p class="cal-season" id="cal-season"></p>
  <div class="cal-rule" role="separator"></div>
  <p class="cal-feast"  id="cal-feast"></p>
  <a class="cal-feast-link" id="cal-feast-link" target="_blank"
     rel="noopener noreferrer" hidden></a>
  <img class="cal-picture" id="cal-picture" alt="" hidden>
  <p class="cal-profane" id="cal-profane"></p>
  <div class="cal-notify" id="cal-notify" hidden>
    <button class="cal-notify-btn" id="cal-notify-enable" type="button">Enable notifications</button>
    <button class="cal-notify-btn cal-notify-btn--dim" id="cal-notify-dismiss" type="button">Not now</button>
  </div>
  <p class="cal-privacy"><a href="privacy.html">Privacy policy</a></p>
</div>

<!-- Calendar engine — must load in this order -->
<script src="calendar/data.js"></script>
<script src="calendar/engine.js"></script>
<script src="calendar/lunar.js"></script>
<script src="calendar/pictures.js"></script>
<script src="app/main.js"></script>
</body>
</html>
