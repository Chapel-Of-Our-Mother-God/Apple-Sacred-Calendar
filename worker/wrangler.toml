name = "sacred-calendar-notifications"
main = "src/index.js"
compatibility_date = "2024-09-25"

# @block65/webcrypto-web-push uses Web Crypto API only — nodejs_compat not required.

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "chapel-sacred-calendar"
database_id = "328b0634-0caf-41a8-a96b-1ab9985df67a"

[vars]
# Contact address shown to push services.  Replace before deploying.
VAPID_SUBJECT = "https://mother-god.com"

# VAPID key pair — set as Worker secrets, never committed to source:
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
# Generate once (requires Node.js):
#   npx web-push generate-vapid-keys
